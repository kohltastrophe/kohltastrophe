<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 96" width="680" height="96" role="img" aria-label="Sponsors">
  <style>
    .font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .tier-heading {
      fill: #656d76;
      font-size: 12px;
      font-weight: 500;
    }
    .sponsor-name {
      fill: #1f2328;
      font-size: 12px;
      font-weight: 500;
    }
    .sponsor-login {
      fill: #656d76;
      font-size: 11px;
      font-weight: 400;
    }
    .avatar-ring {
      fill: none;
      stroke: #d0d7de;
      stroke-width: 1.25;
    }
    .avatar-ring-featured {
      fill: none;
      stroke: #bf3989;
      stroke-width: 1.5;
      stroke-opacity: 0.55;
    }
    .avatar-fallback {
      fill: #f6f8fa;
    }
    .avatar-initial {
      fill: #57606a;
      font-weight: 600;
    }
    .cta-card {
      fill: #f6f8fa;
      stroke: #d0d7de;
      stroke-width: 1;
    }
    .cta-title {
      fill: #1f2328;
      font-size: 13px;
      font-weight: 600;
    }
    .cta-sub {
      fill: #656d76;
      font-size: 11.5px;
      font-weight: 400;
    }
    .cta-slot-github {
      fill: #bf3989;
      fill-opacity: 0.1;
      stroke: #bf3989;
      stroke-width: 1.25;
      stroke-dasharray: 3 3;
    }
    .cta-icon-github {
      fill: #bf3989;
    }
    .cta-pill-github {
      fill: #bf3989;
      fill-opacity: 0.1;
      stroke: #bf3989;
      stroke-width: 1;
      stroke-opacity: 0.35;
    }
    .cta-pill-text-github {
      fill: #bf3989;
      font-size: 12px;
      font-weight: 600;
    }
    .cta-slot-kofi {
      fill: #e04f4c;
      fill-opacity: 0.1;
      stroke: #e04f4c;
      stroke-width: 1.25;
      stroke-dasharray: 3 3;
    }
    .cta-icon-kofi {
      fill: #e04f4c;
    }
    .cta-pill-kofi {
      fill: #e04f4c;
      fill-opacity: 0.1;
      stroke: #e04f4c;
      stroke-width: 1;
      stroke-opacity: 0.35;
    }
    .cta-pill-text-kofi {
      fill: #e04f4c;
      font-size: 12px;
      font-weight: 600;
    }
    @media (prefers-color-scheme: dark) {
      .tier-heading { fill: #8b949e; }
      .sponsor-name { fill: #e6edf3; }
      .sponsor-login { fill: #8b949e; }
      .avatar-ring { stroke: #30363d; }
      .avatar-ring-featured { stroke: #db61a2; stroke-opacity: 0.65; }
      .avatar-fallback { fill: #161b22; }
      .avatar-initial { fill: #8b949e; }
      .cta-card { fill: #161b22; stroke: #30363d; }
      .cta-title { fill: #e6edf3; }
      .cta-sub { fill: #8b949e; }
      .cta-slot-github { fill: #db61a2; fill-opacity: 0.14; stroke: #db61a2; }
      .cta-icon-github { fill: #db61a2; }
      .cta-pill-github { fill: #db61a2; fill-opacity: 0.14; stroke: #db61a2; stroke-opacity: 0.45; }
      .cta-pill-text-github { fill: #db61a2; }
      .cta-slot-kofi { fill: #ff7875; fill-opacity: 0.14; stroke: #ff7875; }
      .cta-icon-kofi { fill: #ff7875; }
      .cta-pill-kofi { fill: #ff7875; fill-opacity: 0.14; stroke: #ff7875; stroke-opacity: 0.45; }
      .cta-pill-text-kofi { fill: #ff7875; }
    }
  </style>
  <defs>
    <clipPath id="std-0"><circle cx="340.0" cy="41.0" r="23.0" /></clipPath>
  </defs>
  <a href="https://github.com/ryanlua" target="_blank" rel="noopener noreferrer">
    <title>Ryan Luu (@ryanlua)</title>
    <image x="317.0" y="18.0" width="46" height="46" href="data:image/png;base64," clip-path="url(#std-0)" />
    <circle class="avatar-ring" cx="340.0" cy="41.0" r="23.0" />
    <text class="font sponsor-login" x="340.0" y="80.0" text-anchor="middle">ryanlua</text>
  </a>
</svg>
