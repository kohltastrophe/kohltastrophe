  <circle class="cta-slot-github" cx="28" cy="28" r="16" pathLength="96" />
  <path class="cta-icon-github" transform="translate(21.2, 21.5) scale(0.85)" d="M7.655 14.916v-.001h-.002l-.006-.003-.018-.01a22.066 22.066 0 0 1-3.744-2.584C2.045 10.731 0 8.35 0 5.5 0 2.836 2.086 1 4.25 1 5.797 1 7.153 1.802 8 3.02 8.847 1.802 10.203 1 11.75 1 13.914 1 16 2.836 16 5.5c0 2.85-2.044 5.231-3.886 6.818a22.094 22.094 0 0 1-3.433 2.414 7.152 7.152 0 0 1-.31.17l-.018.01-.008.004a.75.75 0 0 1-.69 0Z" />
  <text class="font cta-title" x="56" y="24">GitHub Sponsors</text>
  <text class="font cta-sub" x="56" y="40">Monthly &amp; one-time tiers</text>
  <rect class="cta-pill-github" x="222" y="15" width="70" height="26" rx="13" />
  <text class="font cta-pill-text-github" x="257.0" y="32.2" text-anchor="middle">Sponsor</text>
