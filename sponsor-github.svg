      font-size: 11px;
      font-weight: 400;
    }
    .avatar-ring {
      fill: none;
      stroke: #d0d7de;
      stroke-width: 1.25;
    }
    .avatar-ring-featured {
      fill: none;
      stroke: #bf3989;
      stroke-width: 1.5;
      stroke-opacity: 0.55;
    }
    .avatar-fallback {
      fill: #f6f8fa;
    }
    .avatar-initial {
      fill: #57606a;
      font-weight: 600;
    }
    .cta-card {
      fill: #f6f8fa;
      stroke: #d0d7de;
      stroke-width: 1;
    }
    .cta-title {
      fill: #1f2328;
      font-size: 13px;
      font-weight: 600;
    }
    .cta-sub {
      fill: #656d76;
      font-size: 11.5px;
      font-weight: 400;
    }
    .cta-slot-github {
      fill: #bf3989;
      fill-opacity: 0.1;
      stroke: #bf3989;
      stroke-width: 1.25;
      stroke-dasharray: 3 3;
    }
    .cta-icon-github {
      fill: #bf3989;
    }
    .cta-pill-github {
      fill: #bf3989;
      fill-opacity: 0.1;
      stroke: #bf3989;
      stroke-width: 1;
      stroke-opacity: 0.35;
    }
    .cta-pill-text-github {
      fill: #bf3989;
      font-size: 12px;
      font-weight: 600;
    }
    .cta-slot-kofi {
      fill: #e04f4c;
      fill-opacity: 0.1;
      stroke: #e04f4c;
      stroke-width: 1.25;
      stroke-dasharray: 3 3;
    }
    .cta-icon-kofi {
      fill: #e04f4c;
    }
    .cta-pill-kofi {
      fill: #e04f4c;
      fill-opacity: 0.1;
      stroke: #e04f4c;
      stroke-width: 1;
      stroke-opacity: 0.35;
    }
    .cta-pill-text-kofi {
      fill: #e04f4c;
      font-size: 12px;
      font-weight: 600;
    }
    @media (prefers-color-scheme: dark) {
