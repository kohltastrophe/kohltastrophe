<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 56" width="304" height="56" role="img" aria-label="Sponsor on GitHub Sponsors">
  <style>
    .font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .tier-heading {
      fill: #656d76;
      font-size: 12px;
      font-weight: 500;
    }
    .sponsor-name {
      fill: #1f2328;
      font-size: 12px;
      font-weight: 500;
    }
    .sponsor-login {
